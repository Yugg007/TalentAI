spring.application.name=SpringCoreBackend
server.port=7006
server.servlet.context-path=/api/v1/core

#ai.worker.url=http://localhost:8008

# Security & Gateway Trust
# This allows Spring Boot to trust headers sent by Kong (like X-Forwarded-For)
server.forward-headers-strategy=framework

# CORS Configuration
# Note: Since Kong is handling CORS globally, you can disable it in Spring 
# to avoid "Duplicate Header" errors in the browser.
spring.mvc.cors.allow-credentials=true
spring.mvc.cors.allowed-origins=http://localhost:3000



# Disable JPA and Security auto-configuration
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration



# Optional (good practice)
spring.jpa.hibernate.ddl-auto=update

# Hibernate dialect (for MySQL)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/talentai
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MongoDB Configuration for ATS cache
spring.data.mongodb.uri=mongodb://localhost:27017/TalentAI

server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=iampass
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=talentai


# Kafka Bootstrap Servers (The address of your Kafka broker)
spring.kafka.bootstrap-servers=localhost:9092

# Consumer Configuration
spring.kafka.consumer.group-id=talent-ai-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Producer Configuration (Optional but recommended)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer


google.client.id=${GOOGLE_CLIENT_ID:}
google.client.secret=${GOOGLE_CLIENT_SECRET:}
google.redirect.uri=https://localhost:9002/TalentAI/api/google/oauth2callback

