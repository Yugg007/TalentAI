_format_version: "3.0"

services:
  # 1. Spring Boot: Business Logic & Auth
  - name: spring-core-backend
    url: https://host.docker.internal:7006
    tls_verify: false
    routes:
      - name: spring-core-backend-route
        paths:
          - /api/v1/core
        strip_path: false

  # 2. Node.js: Real-time Communication
  - name: node-communication-service
    url: http://host.docker.internal:7007
    routes:
      - name: node-communicationroute
        paths:
          - /api/v1/comm
          - /socket.io
        strip_path: false

  # 3. AI Analysis: Local Llama 3.1 Proxy
  - name: ai-analysis-service
    url: http://host.docker.internal:7008  # Your Python/AI Worker
    routes:
      - name: ai-analyze-route
        paths:
          - /api/v1/analyze
    plugins:
      # Safety net to prevent GPU/CPU overload
      - name: rate-limiting
        config:
          minute: 3
          policy: local
      # AI Power Flex: Connects your route directly to Llama 3.1
      - name: ai-proxy
        config:
          route_type: llm/v1/chat
          model:
            provider: llama2 # Use llama2 provider for Ollama/Llama3 compatibility
            name: llama3.1
            options:
              llama2_format: ollama
              upstream_url: "http://host.docker.internal:11434/api/chat"

# Global Security & Interactivity
plugins:
  - name: cors
    config:
      origins: ["http://localhost:7000"]  # Allow your React app
      methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
      headers: ["Accept", "Content-Length", "Content-Type", "Accept-Encoding", "Authorization"]
      credentials: true