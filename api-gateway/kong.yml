
_format_version: "3.0"

services:
  - name: spring-core-backend
    url: http://host.docker.internal:7003
    routes:
      - name: spring-core-backend-route
        paths:
          - /api/v1/core
        strip_path: false

  - name: node-communication-service
    url: http://host.docker.internal:7007
    routes:
      - name: node-communication-route
        paths:
          - /api/v1/comm
          - /socket.io
        strip_path: false

plugins:
  - name: cors
    config:
      origins:
        - http://localhost:7001
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Content-Length
        - Content-Type
        - Accept-Encoding
        - Authorization
      credentials: true